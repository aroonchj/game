<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WHERE WINDS MEET · MODULAR MMORPG</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="app">
  <div id="login-screen">
    <div id="login-box">
      <div class="brush-title header-tag">WHERE WINDS MEET · ARPG 3D</div>
      <h1 class="brush-title main-title" id="authTitle">สร้างจอมยุทธ์ใหม่</h1>
      <div class="sub-desc">โลกแห่งจอมยุทธ์ Open-World MMORPG</div>

      <div class="auth-tabs">
        <button class="auth-tab-btn" id="tabLoginBtn" onclick="switchAuthTab('login')">เข้าสู่ระบบ</button>
        <button class="auth-tab-btn active" id="tabRegisterBtn" onclick="switchAuthTab('register')">สร้างตัวละครใหม่</button>
      </div>

      <div class="field">
        <label>ชื่อจอมยุทธ์ (Username)</label>
        <input id="nameInput" maxlength="12" placeholder="เช่น เอี้ยก้วย" autocomplete="off" />
      </div>

      <div class="field">
        <label>รหัสผ่านวรยุทธ์ (Password)</label>
        <input id="passInput" type="password" maxlength="20" placeholder="รหัสผ่านอย่างน้อย 6 ตัว" autocomplete="off" />
      </div>

      <div id="registerExtraFields" style="display: flex; flex-direction: column; gap: 10px;">
        <div class="field">
          <label>เพศของจอมยุทธ์</label>
          <div class="grid-opt" id="genderGrid">
            <div class="opt-btn active" onclick="selectGender('male', this)">👦 บุรุษ</div>
            <div class="opt-btn" onclick="selectGender('female', this)">👩 สตรี</div>
          </div>
        </div>
        <div class="field">
          <label>สำนักยุทธ์</label>
          <div class="grid-opt" id="classGrid">
            <div class="opt-btn active" onclick="selectClass(0, this)">⚔️ กระบี่เมฆา</div>
            <div class="opt-btn" onclick="selectClass(1, this)">🗡️ ดาบสุริยัน</div>
            <div class="opt-btn" onclick="selectClass(2, this)">🥊 หมัดมังกร</div>
            <div class="opt-btn" onclick="selectClass(3, this)">🏹 ธนูพฤกษา</div>
          </div>
        </div>
        <div class="field">
          <label>ชุดคลุม</label>
          <div class="grid-opt-4" id="colorGrid">
            <div class="opt-btn active" onclick="selectColor(0, this)">ขาว</div>
            <div class="opt-btn" onclick="selectColor(1, this)">ทอง</div>
            <div class="opt-btn" onclick="selectColor(2, this)">อัคคี</div>
            <div class="opt-btn" onclick="selectColor(3, this)">ราตรี</div>
          </div>
        </div>
      </div>

      <div class="field">
        <label>รหัสห้องเซิร์ฟเวอร์</label>
        <input id="roomInput" value="luoyang888" autocomplete="off" />
      </div>

      <button id="startBtn">เข้าสู่ยุทธภพ</button>
    </div>
  </div>

  <div id="game-view">
    <div id="toast"></div>

    <!-- หลอดเลือดบอส / มอนสเตอร์ที่ถูกล็อคเป้า -->
    <div id="boss-bar-box">
      <div class="boss-title-row">
        <span id="bossNameText">เป้าหมาย</span>
        <span id="bossLvlText" style="color:var(--gold-bright)">Lv.1</span>
      </div>
      <div class="boss-hp-frame"><div class="boss-hp-fill" id="bossHpFill" style="width:100%"></div></div>
    </div>

    <div id="hud">
      <div id="player-hud">
        <div id="avatar"></div>
        <div id="bars-box">
          <div class="hud-name-row"><span id="pNameText">จอมยุทธ์</span><span class="vip-badge" id="vipBadge">VIP 0</span><span id="pLvText">Lv.1</span></div>
          <div class="hud-bar"><div class="hud-hp" id="myHpBar" style="width:100%"></div></div>
          <div class="hud-bar"><div class="hud-exp" id="myExpBar" style="width:0%"></div></div>
          <div class="hud-stats-row"><span>💰 <span id="moneyText">200</span> ตำลึง</span><span>⚔️ ATK: <span id="atkText">35</span></span></div>
        </div>
      </div>
      <button id="auto-btn" onclick="toggleAutoBattle()">🤖 ออโต้บอท: ปิด</button>
      <div id="top-menu">
        <button class="menu-btn" onclick="openModal('charModal')">👤 ตัวละคร</button>
        <button class="menu-btn" onclick="openModal('invModal')">🎒 กระเป๋า</button>
        <button class="menu-btn" onclick="openModal('teleportModal')">🌀 วาร์ป</button>
        <button class="menu-btn" onclick="openModal('vipModal')">👑 VIP</button>
      </div>
      <div id="skill-wheel">
        <div class="btn-main-atk" onclick="window.CombatSystem.castSkill('atk')">⚔️</div>
      </div>
    </div>
    <div id="canvas3d"></div>
  </div>

  <div class="modal" id="charModal"><div class="modal-box"><h3>ข้อมูลตัวละคร</h3><button class="menu-btn" onclick="closeModal('charModal')">ปิด</button></div></div>
  <div class="modal" id="inspectModal"><div class="modal-box"><h3 id="inspectTitle">ข้อมูลเพื่อน</h3><div id="inspectContent"></div><button class="menu-btn" onclick="closeModal('inspectModal')">ปิด</button></div></div>
  <div class="modal" id="teleportModal"><div class="modal-box"><h3>วาร์ปแผนที่</h3><button class="opt-btn" onclick="teleportTo(0,0,'ลานเมืองหลวง')">🏛️ ลานเมืองหลวง</button><button class="opt-btn" onclick="teleportTo(0,50,'ลานประลอง PvP')">⚔️ ลานประลอง PvP</button><button class="menu-btn" onclick="closeModal('teleportModal')">ปิด</button></div></div>
  <div class="modal" id="invModal"><div class="modal-box"><h3>กระเป๋า</h3><button class="menu-btn" onclick="closeModal('invModal')">ปิด</button></div></div>
  <div class="modal" id="vipModal"><div class="modal-box"><h3>VIP</h3><button class="menu-btn" onclick="closeModal('vipModal')">ปิด</button></div></div>

  <div id="debugPanel">
    <div class="hdr"><span>🔧 Debug Log</span><button id="clearDebugBtn">ล้าง</button></div>
    <div id="debugLines"></div>
  </div>
</div>

<script src="js/config.js"></script>
<script src="js/world.js"></script>
<script src="js/player.js"></script>
<script src="js/combat.js"></script>
<script src="js/main.js"></script>
</body>
</html>
