<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+Thai:wght@400;600;700&display=swap');

:root{
  --ink:#0b0806; --ink-2:#16100c; --paper:#efe6d5;
  --gold:#d4af37; --gold-bright:#fae17d;
  --crimson:#8b1e2f; --crimson-bright:#e63950;
  --panel-bg: rgba(18, 13, 9, 0.94);
}
*{ box-sizing:border-box; }
html,body{ margin:0; height:100%; background:radial-gradient(ellipse at 50% 20%,#2a1c12 0%,var(--ink) 85%);
  color:var(--paper); font-family:'Noto Sans Thai',sans-serif; overflow:hidden; user-select:none; }
.brush-title{ font-family:'Noto Serif SC','Noto Sans Thai',serif; font-weight:900; letter-spacing:.08em; }
#app{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; flex-direction:column; position:relative; }

#landing{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:32px; max-width:440px; text-align:center; background:var(--panel-bg); border:1px solid #5a452d; border-radius:8px; box-shadow:0 12px 40px rgba(0,0,0,0.8); }
#landing h1{ font-size:2.2em; margin:0; color:var(--gold-bright); text-shadow:0 0 20px rgba(250,225,125,.4); }
#landing .sub{ color:#bfae91; font-size:.9em; margin-top:-8px; }
.divider{ width:160px; height:2px; background:linear-gradient(90deg,transparent,var(--gold),transparent); margin:4px 0; }
.field{ display:flex; flex-direction:column; gap:6px; width:100%; text-align:left; }
.field label{ font-size:.8em; color:#d2c4a7; font-weight:600; }
.field input{ background:var(--ink-2); border:1px solid #5a452d; color:var(--paper); padding:11px 14px; border-radius:4px; font-size:1em; font-family:inherit; outline:none; }
.field input:focus{ border-color:var(--gold-bright); }
button{ cursor:pointer; border:none; font-family:'Noto Sans Thai',sans-serif; font-weight:600; }
#joinBtn{ margin-top:6px; width:100%; background:linear-gradient(180deg,#f3d36b,var(--gold)); color:#1a1205; padding:13px; font-size:1.08em; border-radius:4px; box-shadow:0 4px 20px rgba(212,175,55,.3); font-weight:700; }
#joinBtn:hover{ filter:brightness(1.1); }

.classpick{ display:flex; gap:8px; width:100%; }
.classbtn{ flex:1; padding:10px 4px; border:1px solid #5a452d; background:var(--ink-2); color:#bfae91; border-radius:4px; font-size:.78em; }
.classbtn.active{ border-color:var(--gold-bright); color:var(--gold-bright); background:#312415; }

#game{ display:none; flex-direction:column; align-items:center; width:100%; height:100%; position:relative; }
#topbar{ width:min(960px,96vw); display:flex; align-items:center; justify-content:space-between; gap:16px; padding:10px 8px; }
#meblock{ flex:1; max-width:320px; font-size:.82em; color:#dcd2be; }
#meblock .lvline{ display:flex; justify-content:space-between; margin-bottom:4px; font-weight:700; }
.bar-outer{ width:100%; height:10px; background:#221810; border:1px solid #5a452d; border-radius:4px; overflow:hidden; margin-bottom:4px; }
.bar-hp{ height:100%; background:linear-gradient(90deg,#9e1b2f,#f24962); transition:width .2s; }
.bar-exp{ height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-bright)); transition:width .3s; }

#roster{ display:flex; gap:6px; flex-wrap:wrap; }
.rostertag{ font-size:.72em; padding:4px 9px; border-radius:4px; border:1px solid #5a452d; color:#8e8067; background:rgba(0,0,0,.3); }
.rostertag.active{ color:var(--gold-bright); border-color:#826639; background:rgba(212,175,55,.1); }

canvas{ background:#1c1712; border:2px solid #5a452d; border-radius:6px; box-shadow:0 12px 50px rgba(0,0,0,.8), inset 0 0 100px rgba(0,0,0,.6); touch-action:none; }

/* Action Skills Bar */
#skillbar{ display:flex; gap:12px; margin-top:10px; z-index:10; }
.skill-btn{ width:60px; height:60px; border-radius:8px; background:linear-gradient(145deg, #2a1f18, #140d09); border:2px solid #6b5334; display:flex; flex-direction:column; align-items:center; justify-content:center; color:var(--gold-bright); position:relative; overflow:hidden; box-shadow:0 4px 12px rgba(0,0,0,.5); }
.skill-btn:active{ transform:scale(0.95); }
.skill-btn .key{ font-size:.7em; color:#a89679; position:absolute; top:2px; left:4px; }
.skill-btn .name{ font-size:.72em; font-weight:700; margin-top:14px; }
.skill-btn .cd-overlay{ position:absolute; inset:0; background:rgba(0,0,0,0.7); height:0%; top:0; transition:height .1s linear; }

#status{ margin-top:6px; font-size:.82em; color:#dcd2be; min-height:1.2em; }
#room-tag{ position:absolute; top:12px; left:50%; transform:translateX(-50%); font-size:.75em; color:#a39274; background:rgba(0,0,0,.5); padding:3px 12px; border-radius:12px; border:1px solid #4a3822; }

#chatlog{ position:absolute; left:16px; bottom:16px; width:260px; max-height:120px; overflow:hidden; font-size:.75em; color:#dcd2be; display:flex; flex-direction:column-reverse; gap:3px; pointer-events:none; }
#chatform{ display:flex; gap:6px; margin-top:6px; width:min(960px,94vw); }
#chatInput{ flex:1; background:var(--ink-2); border:1px solid #5a452d; color:var(--paper); padding:8px 12px; border-radius:4px; font-family:inherit; font-size:.85em; outline:none; }
#chatSendBtn{ background:linear-gradient(180deg,#f3d36b,var(--gold)); color:#1a1205; padding:0 16px; border-radius:4px; font-size:.85em; font-weight:700; }

#toast{ position:absolute; top:60px; left:50%; transform:translateX(-50%); font-size:.88em; color:var(--gold-bright); background:rgba(18,13,9,.92); padding:8px 20px; border-radius:20px; border:1px solid var(--gold); display:none; z-index:40; }
</style>
</head>
<body>
<div id="app">

  <div id="landing">
    <div class="brush-title" style="font-size:.85em;letter-spacing:.3em;color:#a89779;">刃 義</div>
    <h1 class="brush-title">เมืองลั่วหยาง</h1>
    <div class="sub">Sword of Justice · สกิลวิชายุทธ์เต็มรูปแบบ</div>
    <div class="divider"></div>

    <div class="field">
      <label>ชื่อจอมยุทธ์</label>
      <input id="nameInput" maxlength="12" placeholder="เช่น หวงเฟยหง" />
    </div>
    <div class="field">
      <label>สำนักเพลงดาบ</label>
      <div class="classpick" id="classPick">
        <button type="button" class="classbtn active" data-c="0">กระบี่เมฆา</button>
        <button type="button" class="classbtn" data-c="1">ดาบสุริยัน</button>
        <button type="button" class="classbtn" data-c="2">หมัดมังกร</button>
      </div>
    </div>
    <div class="field">
      <label>ชื่อสำนัก / กิลด์</label>
      <input id="guildInput" maxlength="14" placeholder="เช่น บัวหิมะ" />
    </div>
    <div class="field">
      <label>รหัสห้องเมือง</label>
      <input id="roomInput" maxlength="16" placeholder="เช่น luoyang888" />
    </div>

    <button id="joinBtn">เข้าสู่เมืองยุทธภพ</button>
  </div>

  <div id="game">
    <div id="room-tag"></div>
    <div id="toast"></div>
    <div id="topbar">
      <div id="meblock">
        <div class="lvline"><span id="lvText">Lv.1</span><span id="guildText"></span></div>
        <div class="bar-outer"><div class="bar-hp" id="myHpBar" style="width:100%"></div></div>
        <div class="bar-outer"><div class="bar-exp" id="expBar" style="width:0%"></div></div>
      </div>
      <div id="roster"></div>
    </div>

    <canvas id="canvas" width="960" height="460"></canvas>

    <!-- Skill Bar -->
    <div id="skillbar">
      <div class="skill-btn" id="btnAtk" onclick="tryAttack()">
        <span class="key">Space</span>
        <span class="name">โจมตี</span>
        <div class="cd-overlay" id="cdAtk"></div>
      </div>
      <div class="skill-btn" id="btnQ" onclick="castSkill('Q')">
        <span class="key">Q</span>
        <span class="name">ตัดเมฆา</span>
        <div class="cd-overlay" id="cdQ"></div>
      </div>
      <div class="skill-btn" id="btnE" onclick="castSkill('E')">
        <span class="key">E</span>
        <span class="name">หมื่นกระบี่</span>
        <div class="cd-overlay" id="cdE"></div>
      </div>
      <div class="skill-btn" id="btnR" onclick="castSkill('R')">
        <span class="key">R</span>
        <span class="name">ปราณระเบิด</span>
        <div class="cd-overlay" id="cdR"></div>
      </div>
    </div>

    <div id="status">กำลังเชื่อมต่อ...</div>

    <form id="chatform">
      <input id="chatInput" maxlength="60" placeholder="พิมพ์คุยในเมือง..." autocomplete="off" />
      <button id="chatSendBtn" type="submit">ส่ง</button>
    </form>
    <div id="chatlog"></div>
  </div>

</div>

<script>
(function(){
"use strict";

const ARENA_W=960, ARENA_H=460;
const MOVE_SPEED=4.0;
const PLAYER_MAX_HP=150;
const MONSTER_MAX_HP=250;
const EXP_PER_KILL=50;

// ตำแหน่งมอนสเตอร์นอกประตูลานเมือง
const MONSTER_SPAWNS = [
  { id:'m1', x:750, y:180 },
  { id:'m2', x:750, y:320 },
];

let sb=null, channel=null;
let roomCode="", myName="", myClass=0, myGuild="", myId="";
let gameActive=false, isHost=false;
let keys={};
let particles=[];
let popups=[];
let skillProjectiles=[];
let petals=[];
let chatMessages=[];
let lastSyncTime=0;

// Cooldowns
let cooldowns = {
  atk: { cd: 400, until: 0 },
  Q: { cd: 2500, until: 0, dmg: 35, range: 120 },
  E: { cd: 5000, until: 0, dmg: 55, range: 160 },
  R: { cd: 8000, until: 0, dmg: 85, range: 200 }
};

let me = {
  id:'', x:250, y:230, facing:1, attacking:false, attackUntil:0,
  name:'', classIdx:0, guild:'', costume:0,
  hp:PLAYER_MAX_HP, maxHp:PLAYER_MAX_HP, isDead:false, respawnAt:0,
  joinedAt:0
};

let otherPlayers = {};
let myProgress = { level:1, exp:0 };
let monsters = MONSTER_SPAWNS.map(s=>({ id:s.id, x:s.x, y:s.y, hp:MONSTER_MAX_HP, maxHp:MONSTER_MAX_HP, alive:true }));

const landing=document.getElementById('landing');
const gameEl=document.getElementById('game');
const joinBtn=document.getElementById('joinBtn');
const nameInput=document.getElementById('nameInput');
const roomInput=document.getElementById('roomInput');
const guildInput=document.getElementById('guildInput');
const classPick=document.getElementById('classPick');
const statusEl=document.getElementById('status');
const roomTag=document.getElementById('room-tag');
const rosterEl=document.getElementById('roster');
const chatlogEl=document.getElementById('chatlog');
const chatform=document.getElementById('chatform');
const chatInput=document.getElementById('chatInput');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const lvText=document.getElementById('lvText');
const guildText=document.getElementById('guildText');
const myHpBar=document.getElementById('myHpBar');
const expBar=document.getElementById('expBar');
const toastEl=document.getElementById('toast');

// สร้างกลีบดอกท้อปลิวในเมือง
for(let i=0; i<30; i++){
  petals.push({ x:Math.random()*ARENA_W, y:Math.random()*ARENA_H, vx:0.8+Math.random()*1.2, vy:0.4+Math.random()*0.8, size:3+Math.random()*3 });
}

classPick.querySelectorAll('.classbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    classPick.querySelectorAll('.classbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    myClass = parseInt(btn.dataset.c,10);
  });
});

joinBtn.addEventListener('click', joinRoom);
[nameInput, roomInput, guildInput].forEach(inp=> inp.addEventListener('keydown', e=>{ if(e.key==='Enter') joinRoom(); }));

function genId(){ return 'p_' + Math.random().toString(36).slice(2,8); }
function expNeeded(level){ return 120 * level; }
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.style.display='block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ toastEl.style.display='none'; }, 3200);
}

function addDamagePopup(x, y, text, color='#ffd13b'){
  popups.push({ x: x + (Math.random()-0.5)*20, y: y - 25, text, color, life: 1.0 });
}

async function joinRoom(){
  const nm = nameInput.value.trim();
  const rc = roomInput.value.trim().toLowerCase().replace(/\s+/g,'');
  const gd = guildInput.value.trim();
  if(!nm){ nameInput.focus(); return; }
  if(!rc){ roomInput.focus(); return; }

  myName=nm; roomCode=rc; myGuild=gd; myId=genId();
  me.id = myId;
  joinBtn.disabled=true; joinBtn.textContent='กำลังเข้าเมือง...';

  try{
    sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    const { data: prow } = await sb.from('mmo_players').select('*').eq('name', myName).maybeSingle();
    if(prow){
      myProgress.level = prow.level || 1;
      myProgress.exp = prow.exp || 0;
    } else {
      myProgress = { level:1, exp:0 };
      await sb.from('mmo_players').insert({ name: myName, level:1, exp:0, guild:myGuild, costume:myClass });
    }

    me.name = myName; me.guild = myGuild; me.classIdx = myClass; me.joinedAt = Date.now();

    const channelName = 'room_' + roomCode;
    channel = sb.channel(channelName, {
      config: { broadcast: { ack: false, self: false }, presence: { key: myId } }
    });

    channel.on('broadcast', { event: 'pos' }, ({ payload }) => {
      if(payload.id && payload.id !== myId){
        otherPlayers[payload.id] = Object.assign(otherPlayers[payload.id] || {}, payload);
      }
    });

    channel.on('broadcast', { event: 'skill' }, ({ payload }) => {
      if(payload.id !== myId){
        triggerSkillVisuals(payload.skill, payload.x, payload.y, payload.facing);
      }
      if(isHost) checkSkillHitMonster(payload);
      checkSkillHitMe(payload);
    });

    channel.on('broadcast', { event: 'monsters' }, ({ payload }) => {
      if(!isHost && payload.monsters) monsters = payload.monsters;
    });

    channel.on('broadcast', { event: 'reward' }, ({ payload }) => {
      if(payload.targetName === myName) gainExp(payload.exp, payload.sourceName);
    });

    channel.on('broadcast', { event: 'chat' }, ({ payload }) => {
      addChatLine(payload.name, payload.text);
    });

    channel.on('presence', { event: 'sync' }, () => {
      const state = channel.presenceState();
      const keys = Object.keys(state);
      
      Object.keys(otherPlayers).forEach(id => {
        if(!state[id]) delete otherPlayers[id];
      });

      let earliest = myId;
      let earliestTime = me.joinedAt;
      keys.forEach(k => {
        const u = state[k]?.[0];
        if(u && u.joinedAt < earliestTime){
          earliest = k;
          earliestTime = u.joinedAt;
        }
      });
      isHost = (earliest === myId);
      renderRoster(state);
    });

    channel.subscribe(async (status) => {
      if(status === 'SUBSCRIBED'){
        await channel.track({ name: myName, guild: myGuild, joinedAt: me.joinedAt });
        landing.style.display = 'none';
        gameEl.style.display = 'flex';
        roomTag.textContent = `ลานเมือง: ${roomCode}`;
        statusEl.textContent = 'ยินดีต้อนรับสู่ลานเมืองยุทธภพ';
        updateMeHUD();
        gameActive = true;
        requestAnimationFrame(loop);
      }
    });

  }catch(err){
    joinBtn.disabled=false; joinBtn.textContent='เข้าสู่เมืองยุทธภพ';
  }
}

// ---------------- สกิล & การต่อสู้ ----------------
window.castSkill = function(skillKey){
  if(!gameActive || me.isDead) return;
  const sk = cooldowns[skillKey];
  const now = Date.now();
  if(now < sk.until) return;

  sk.until = now + sk.cd;
  triggerSkillVisuals(skillKey, me.x, me.y, me.facing);

  const payload = { id: myId, name: myName, x: me.x, y: me.y, facing: me.facing, skill: skillKey, dmg: sk.dmg, range: sk.range };
  if(channel){
    channel.send({ type: 'broadcast', event: 'skill', payload });
  }
  if(isHost) checkSkillHitMonster(payload);
};

window.tryAttack = function(){
  castSkill('atk');
};

function triggerSkillVisuals(skill, x, y, facing){
  if(skill === 'atk' || skill === 'Q'){
    // คลื่นดาบตัดเมฆาพุ่ง
    const color = skill === 'Q' ? '#fae17d' : '#ffffff';
    skillProjectiles.push({
      x: x + facing*30, y: y-35, vx: facing * (skill==='Q'?9:6), vy: 0,
      size: skill==='Q'?30:15, life: 1, color, skill
    });
  } else if(skill === 'E'){
    // ฝนหมื่นกระบี่หล่นจากฟ้า
    for(let i=0; i<12; i++){
      setTimeout(()=>{
        particles.push({
          x: x + (Math.random()-0.5)*180, y: y - 160,
          vx: (Math.random()-0.5)*2, vy: 10 + Math.random()*4,
          life: 1, decay: 0.04, r: 3, color: '#68d391', type: 'sword'
        });
      }, i * 30);
    }
  } else if(skill === 'R'){
    // ปราณมังกรระเบิดรอบทิศทาง
    for(let i=0; i<45; i++){
      const angle = (i / 45) * Math.PI * 2;
      particles.push({
        x: x, y: y-30,
        vx: Math.cos(angle) * (6 + Math.random()*3),
        vy: Math.sin(angle) * (6 + Math.random()*3),
        life: 1, decay: 0.03, r: 4, color: '#f56565', type: 'fire'
      });
    }
  }
}

function checkSkillHitMe(atk){
  if(me.isDead) return;
  const dist = Math.hypot(atk.x - me.x, atk.y - me.y);
  if(dist < atk.range){
    me.hp = Math.max(0, me.hp - atk.dmg);
    addDamagePopup(me.x, me.y, `-${atk.dmg}`, '#ff4444');
    updateMeHUD();

    if(me.hp <= 0){
      me.isDead = true;
      me.respawnAt = Date.now() + 3500;
      showToast(`ท่านพ่ายแพ้ให้กับวิชาของ [${atk.name}] !`);
      if(channel){
        channel.send({
          type: 'broadcast',
          event: 'reward',
          payload: { targetName: atk.name, exp: EXP_PER_KILL * 2, sourceName: myName }
        });
      }
    }
  }
}

function checkSkillHitMonster(atk){
  let changed = false;
  monsters.forEach(m => {
    if(!m.alive) return;
    const dist = Math.hypot(atk.x - m.x, atk.y - m.y);
    if(dist < atk.range){
      m.hp = Math.max(0, m.hp - atk.dmg);
      addDamagePopup(m.x, m.y, `CRIT -${atk.dmg}!`, '#fae17d');
      changed = true;
      if(m.hp <= 0 && m.alive){
        m.alive = false;
        if(channel){
          channel.send({
            type: 'broadcast',
            event: 'reward',
            payload: { targetName: atk.name, exp: EXP_PER_KILL, sourceName: 'อสูรนอกเมือง' }
          });
        }
        if(atk.name === myName) gainExp(EXP_PER_KILL, 'อสูรนอกเมือง');

        setTimeout(() => {
          m.hp = m.maxHp; m.alive = true;
          if(channel) channel.send({ type:'broadcast', event:'monsters', payload:{ monsters } });
        }, 5000);
      }
    }
  });
  if(changed && channel) channel.send({ type:'broadcast', event:'monsters', payload:{ monsters } });
}

async function gainExp(amount, fromWho){
  myProgress.exp += amount;
  showToast(`+${amount} EXP (ปราบ ${fromWho})`);
  while(myProgress.exp >= expNeeded(myProgress.level)){
    myProgress.exp -= expNeeded(myProgress.level);
    myProgress.level += 1;
    showToast(`🌟 บรรลุวิชา! สำเร็จขั้น Lv.${myProgress.level} 🌟`);
  }
  updateMeHUD();
  await sb.from('mmo_players').update({ exp: myProgress.exp, level: myProgress.level }).eq('name', myName);
}

function renderRoster(state){
  rosterEl.innerHTML = '';
  const userKeys = Object.keys(state);
  userKeys.forEach(k => {
    const u = state[k]?.[0] || {};
    const span = document.createElement('span');
    span.className = 'rostertag active';
    span.textContent = (u.guild ? `[${u.guild}] ` : '') + (u.name || 'จอมยุทธ์');
    rosterEl.appendChild(span);
  });
}

function updateMeHUD(){
  lvText.textContent = `Lv.${myProgress.level}`;
  guildText.textContent = myGuild ? `[${myGuild}]` : '';
  myHpBar.style.width = Math.max(0, (me.hp / me.maxHp) * 100) + '%';
  expBar.style.width = Math.min(100, (myProgress.exp / expNeeded(myProgress.level)) * 100) + '%';
}

// Key Inputs
window.addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()] = true;
  if(e.key === ' ') { e.preventDefault(); tryAttack(); }
  if(e.key.toLowerCase() === 'q') castSkill('Q');
  if(e.key.toLowerCase() === 'e') castSkill('E');
  if(e.key.toLowerCase() === 'r') castSkill('R');
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousedown', tryAttack);

// Chat
chatform.addEventListener('submit', e=>{
  e.preventDefault();
  const text = chatInput.value.trim();
  if(!text) return;
  chatInput.value = '';
  addChatLine(myName, text);
  if(channel) channel.send({ type: 'broadcast', event: 'chat', payload: { name: myName, text } });
});

function addChatLine(name, text){
  chatMessages.unshift({ name, text });
  chatMessages = chatMessages.slice(0, 5);
  chatlogEl.innerHTML = chatMessages.map(m=>`<div><b style="color:var(--gold-bright)">${m.name}:</b> ${m.text}</div>`).join('');
}

// ---------------- Game Loop ----------------
function loop(ts){
  if(!gameActive) return;

  if(me.isDead){
    if(Date.now() > me.respawnAt){
      me.isDead = false;
      me.hp = PLAYER_MAX_HP;
      me.x = 250; me.y = 230;
      updateMeHUD();
      showToast('ฟื้นกำลังคืนชีพ ณ ลานเมือง!');
    }
  } else {
    let dx = 0, dy = 0;
    if(keys['arrowleft'] || keys['a']) dx -= MOVE_SPEED;
    if(keys['arrowright'] || keys['d']) dx += MOVE_SPEED;
    if(keys['arrowup'] || keys['w']) dy -= MOVE_SPEED;
    if(keys['arrowdown'] || keys['s']) dy += MOVE_SPEED;

    if(dx !== 0) me.facing = dx > 0 ? 1 : -1;
    me.x = Math.max(40, Math.min(ARENA_W - 40, me.x + dx));
    me.y = Math.max(80, Math.min(ARENA_H - 40, me.y + dy));
  }

  // Update Cooldown Overlays
  const now = Date.now();
  ['atk','Q','E','R'].forEach(k => {
    const el = document.getElementById('cd' + (k==='atk'?'Atk':k));
    if(el){
      const remaining = Math.max(0, cooldowns[k].until - now);
      const pct = (remaining / cooldowns[k].cd) * 100;
      el.style.height = pct + '%';
    }
  });

  // Sync Position
  if(ts - lastSyncTime > 160 && channel){
    lastSyncTime = ts;
    channel.send({
      type: 'broadcast',
      event: 'pos',
      payload: {
        id: myId, name: myName, guild: myGuild,
        x: me.x, y: me.y, facing: me.facing,
        classIdx: me.classIdx, hp: me.hp, maxHp: me.maxHp, isDead: me.isDead
      }
    });
  }

  // Petals
  petals.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if(p.x > ARENA_W) p.x = 0;
    if(p.y > ARENA_H) p.y = 0;
  });

  // Projectiles
  skillProjectiles.forEach(p => {
    p.x += p.vx;
    p.life -= 0.03;
  });
  skillProjectiles = skillProjectiles.filter(p => p.life > 0);

  // Particles
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= p.decay; });
  particles = particles.filter(p => p.life > 0);

  popups.forEach(p => { p.y -= 0.8; p.life -= 0.02; });
  popups = popups.filter(p => p.life > 0);

  render();
  requestAnimationFrame(loop);
}

// ---------------- วาดฉากเมือง & ตัวละคร ----------------
function drawCityEnvironment(){
  // 1. พื้นลานหินปูเมือง
  ctx.fillStyle = '#221a14';
  ctx.fillRect(0, 0, ARENA_W, ARENA_H);

  ctx.strokeStyle = '#32261c';
  ctx.lineWidth = 1;
  for(let gx=0; gx<ARENA_W; gx+=60){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,ARENA_H); ctx.stroke(); }
  for(let gy=0; gy<ARENA_H; gy+=60){ ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(ARENA_W,gy); ctx.stroke(); }

  // 2. ซุ้มประตูเมืองจีน & ศาลา (ด้านซ้ายและบน)
  ctx.fillStyle = '#421616';
  ctx.fillRect(40, 20, 160, 24); // คานซุ้มประตู
  ctx.fillStyle = '#d4af37';
  ctx.fillRect(44, 16, 152, 4);

  // โคมไฟแดงห้อย
  [60, 180, 520, 680].forEach(lx => {
    ctx.beginPath(); ctx.arc(lx, 50, 9, 0, Math.PI*2);
    ctx.fillStyle = '#e63950'; ctx.shadowColor = '#ff4d4d'; ctx.shadowBlur = 12; ctx.fill();
    ctx.shadowBlur = 0;
  });

  // 3. ป้ายชื่อเมืองกลางลาน
  ctx.font = 'bold 22px "Noto Serif SC"';
  ctx.fillStyle = 'rgba(212,175,55,0.15)';
  ctx.textAlign = 'center';
  ctx.fillText('洛 陽 城 (ลานเมืองลั่วหยาง)', 480, 240);

  // 4. วาดกลีบดอกท้อปลิว
  petals.forEach(p => {
    ctx.beginPath();
    ctx.ellipse(p.x, p.y, p.size, p.size/2, Math.PI/4, 0, Math.PI*2);
    ctx.fillStyle = '#ffb7c5';
    ctx.fill();
  });
}

function drawHero(p){
  if(p.isDead){
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(0, 0, 24, 7, 0, Math.PI*2); ctx.fill();
    ctx.font = '11px "Noto Sans Thai"'; ctx.fillStyle = '#ff5a5a'; ctx.textAlign = 'center';
    ctx.fillText('สลบ...', 0, -12);
    ctx.restore();
    return;
  }

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(p.facing || 1, 1);

  // เงา
  ctx.beginPath(); ctx.ellipse(0, 4, 22, 6, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();

  // ผ้าคลุมจอมยุทธ์ยาวพริ้ว
  ctx.beginPath();
  ctx.moveTo(-8, -48); ctx.quadraticCurveTo(-26, -20, -18, -2);
  ctx.lineTo(-4, -2); ctx.quadraticCurveTo(-8, -25, -2, -48);
  ctx.fillStyle = '#6b1420'; ctx.fill();

  // ชุดจอมยุทธ์ Hanfu พริ้วไหว
  ctx.beginPath();
  ctx.moveTo(-10, -50); ctx.lineTo(10, -50);
  ctx.quadraticCurveTo(16, -20, 11, 0); ctx.lineTo(-11, 0);
  ctx.quadraticCurveTo(-16, -20, -10, -50);
  ctx.fillStyle = '#d4af37'; ctx.fill();
  ctx.strokeStyle = '#2d1e12'; ctx.lineWidth = 1.2; ctx.stroke();

  // ผ้าคาดเอว
  ctx.fillStyle = '#fae17d'; ctx.fillRect(-11, -26, 22, 6);

  // หัว & ทรงผมจอมยุทธ์
  ctx.beginPath(); ctx.arc(0, -60, 10, 0, Math.PI * 2); ctx.fillStyle = '#fce5cd'; ctx.fill();
  ctx.fillStyle = '#1c1510';
  ctx.fillRect(3, -62, 3, 2); // ตา

  // หมวกงอบไม้ไผ่ยอดฝีมือ
  ctx.beginPath();
  ctx.moveTo(-18, -66); ctx.lineTo(0, -78); ctx.lineTo(18, -66);
  ctx.fillStyle = '#bfa15f'; ctx.fill();
  ctx.strokeStyle = '#5a421b'; ctx.stroke();

  // ดาบสะพายหลัง
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(8, -48, 3, 34);

  ctx.restore();

  // หลอดเลือดและชื่อ
  ctx.save();
  ctx.font = '11px "Noto Sans Thai",sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = (p.id === myId) ? '#fae17d' : '#ffffff';
  ctx.fillText((p.guild ? `[${p.guild}] ` : '') + (p.name || ''), p.x, p.y - 84);

  const barW = 44, barH = 4;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(p.x - barW/2, p.y - 80, barW, barH);
  ctx.fillStyle = '#e63950'; ctx.fillRect(p.x - barW/2, p.y - 80, barW * Math.max(0, (p.hp || PLAYER_MAX_HP) / (p.maxHp || PLAYER_MAX_HP)), barH);
  ctx.restore();
}

function drawMonster(m){
  ctx.save();
  ctx.translate(m.x, m.y);
  if(!m.alive){ ctx.restore(); return; }

  // เงา
  ctx.beginPath(); ctx.ellipse(0, 8, 40, 10, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fill();

  // ตัวอสูรเงา
  ctx.beginPath();
  ctx.moveTo(-30, 10); ctx.quadraticCurveTo(-44, -30, -10, -56);
  ctx.quadraticCurveTo(0, -62, 10, -56); ctx.quadraticCurveTo(44, -30, 30, 10);
  ctx.closePath();
  ctx.fillStyle = '#2d182e'; ctx.fill();
  ctx.strokeStyle = '#802671'; ctx.lineWidth = 1.5; ctx.stroke();

  // ตาแดง
  ctx.beginPath(); ctx.arc(-8, -34, 4, 0, Math.PI * 2); ctx.arc(8, -34, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#ff3344'; ctx.shadowColor = '#ff3344'; ctx.shadowBlur = 10; ctx.fill();
  ctx.restore();

  // หลอดเลือด
  ctx.save();
  const w = 50;
  ctx.translate(m.x - w/2, m.y - 74);
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, w, 5);
  ctx.fillStyle = '#e63950'; ctx.fillRect(0, 0, w * (m.hp / m.maxHp), 5);
  ctx.restore();
}

function render(){
  ctx.clearRect(0, 0, ARENA_W, ARENA_H);

  // วาดฉากเมือง
  drawCityEnvironment();

  // วาดมอนสเตอร์
  monsters.forEach(drawMonster);

  // วาดผู้เล่นอื่น
  Object.values(otherPlayers).forEach(drawHero);

  // วาดตัวเอง
  drawHero(me);

  // วาดคมดาบพุ่ง (Projectiles)
  skillProjectiles.forEach(p => {
    ctx.save();
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 18;
    ctx.fill();
    ctx.restore();
  });

  // วาด Particles สกิล
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color; ctx.shadowBlur = 8;
    ctx.fill();
    ctx.restore();
  });

  // ตัวเลขดาเมจ
  popups.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.font = 'bold 15px "Noto Sans Thai",sans-serif';
    ctx.fillStyle = p.color;
    ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
    ctx.textAlign = 'center';
    ctx.fillText(p.text, p.x, p.y);
    ctx.restore();
  });
}

})();
</script>
