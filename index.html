<script>
(function(){
"use strict";

const CLASS_DEFS = [
  { label:'ดาบเมฆ',   main:'#8a6a1a', accent:'#f0cf6a' },
  { label:'หมัดมังกร', main:'#5a1c26', accent:'#c23b4a' },
  { label:'พิณมนตรา', main:'#2c4a3a', accent:'#6fae8f' },
  { label:'เงาราตรี', main:'#2e2447', accent:'#8a76c2' },
];
const COSTUME_DEFS = [
  { label:'ทอง',   main:'#8a6a1a', accent:'#f0cf6a' },
  { label:'อัคคี', main:'#5a1c26', accent:'#c23b4a' },
  { label:'หยก',   main:'#2c4a3a', accent:'#6fae8f' },
  { label:'ราตรี', main:'#2e2447', accent:'#8a76c2' },
  { label:'หิมะ',  main:'#4a4a55', accent:'#dfe8ee' },
  { label:'พิศวาส',main:'#5a2044', accent:'#e888c2' },
];
const ITEM_POOL = ['ผ้าพันคอไหมทอง','ตราสำนักหยก','กระดิ่งวิญญาณ','ชุดหิมะขาว','ชุดพิศวาสชมพู','ลูกประคำมงคล'];
const COSTUME_ITEM_MAP = { 'ชุดหิมะขาว':4, 'ชุดพิศวาสชมพู':5 };

const ARENA_W=900, ARENA_H=460;
const MOVE_SPEED=3.6;
const ATTACK_RANGE=95;
const ATTACK_DURATION=260;
const ATTACK_COOLDOWN=480;
const DAMAGE=15;
const MONSTER_MAX_HP=150;
const MAX_PLAYERS=4;
const SYNC_INTERVAL=200; 
const EXP_PER_KILL=25;

const MONSTER_SPAWNS = [
  { id:'m1', x:220, y:150 },
  { id:'m2', x:680, y:150 },
  { id:'m3', x:450, y:310 },
];

let sb=null, channel=null;
let roomCode="", myName="", myClass=0, myGuild="", myId="";
let gameActive=false, isHost=false;
let keys={};
let particles=[];
let chatMessages=[];
let lastAttackCooldownUntil=0, lastSyncTime=0;
let killsTotalSeen = 0;
let lastDropSeenTs = 0;

let me = {
  x:200, y:230, facing:1, attacking:false, attackUntil:0,
  name:'', classIdx:0, guild:'', costume:0,
  chatMsg:'', chatAt:0, attackAt:0, joinedAt:0
};
let otherPlayers = {};
let myProgress = { level:1, exp:0, unlockedCostumes:[0], inventory:[] };
let monsters = MONSTER_SPAWNS.map(s=>({ id:s.id, x:s.x, y:s.y, hp:MONSTER_MAX_HP, maxHp:MONSTER_MAX_HP, alive:true }));
let roomKillsTotal = 0;

const landing=document.getElementById('landing');
const gameEl=document.getElementById('game');
const joinBtn=document.getElementById('joinBtn');
const nameInput=document.getElementById('nameInput');
const roomInput=document.getElementById('roomInput');
const guildInput=document.getElementById('guildInput');
const classPick=document.getElementById('classPick');
const statusEl=document.getElementById('status');
const roomTag=document.getElementById('room-tag');
const rosterEl=document.getElementById('roster');
const chatlogEl=document.getElementById('chatlog');
const chatform=document.getElementById('chatform');
const chatInput=document.getElementById('chatInput');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const lvText=document.getElementById('lvText');
const guildText=document.getElementById('guildText');
const expBar=document.getElementById('expBar');
const costumeBtn=document.getElementById('costumeBtn');
const costumeModal=document.getElementById('costumeModal');
const costumeList=document.getElementById('costumeList');
const closeCostume=document.getElementById('closeCostume');
const toastEl=document.getElementById('toast');

classPick.querySelectorAll('.classbtn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    classPick.querySelectorAll('.classbtn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    myClass = parseInt(btn.dataset.c,10);
  });
});

joinBtn.addEventListener('click', joinRoom);
[nameInput, roomInput, guildInput].forEach(inp=> inp.addEventListener('keydown', e=>{ if(e.key==='Enter') joinRoom(); }));

const debugLinesEl = document.getElementById('debugLines');
document.getElementById('clearDebugBtn').addEventListener('click', ()=>{ debugLinesEl.innerHTML=''; });
function debugLog(msg, level='info'){
  const time = new Date().toLocaleTimeString('th-TH', {hour12:false});
  const div = document.createElement('div');
  div.className = 'line' + (level==='error' ? ' err' : level==='warn' ? ' warn' : '');
  div.textContent = `[${time}] ${msg}`;
  debugLinesEl.appendChild(div);
  debugLinesEl.parentElement.scrollTop = debugLinesEl.parentElement.scrollHeight;
}

function genId(){ return 'p_' + Math.random().toString(36).slice(2,8); }
function expNeeded(level){ return 100 * level; }
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.style.display='block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ toastEl.style.display='none'; }, 3200);
}

async function joinRoom(){
  const nm = nameInput.value.trim();
  const rc = roomInput.value.trim().toLowerCase().replace(/\s+/g,'');
  const gd = guildInput.value.trim();
  if(!nm){ nameInput.focus(); return; }
  if(!rc){ roomInput.focus(); return; }

  myName=nm; roomCode=rc; myGuild=gd; myId=genId();
  joinBtn.disabled=true; joinBtn.textContent='กำลังเข้าห้อง...';

  try{
    debugLog(`เริ่มเข้าสู่ระบบ: ${myName} (${roomCode})`);
    sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    // 1. ดึงหรือสร้างข้อมูลผู้เล่น
    const { data: prow } = await sb.from('mmo_players').select('*').eq('name', myName).maybeSingle();
    if(prow){
      myProgress.level = prow.level || 1;
      myProgress.exp = prow.exp || 0;
      myProgress.unlockedCostumes = prow.unlocked_costumes || [myClass];
      myProgress.inventory = prow.inventory || [];
      me.costume = prow.costume != null ? prow.costume : myClass;
    } else {
      myProgress = { level:1, exp:0, unlockedCostumes:[myClass], inventory:[] };
      me.costume = myClass;
      await sb.from('mmo_players').insert({
        name: myName, level:1, exp:0, guild:myGuild, costume:myClass, unlocked_costumes:[myClass], inventory:[]
      });
    }

    // 2. ดึงหรือสร้างห้อง
    const { data: rrow } = await sb.from('mmo_rooms').select('*').eq('room_code', roomCode).maybeSingle();
    if(rrow){
      roomKillsTotal = rrow.kills || 0;
      if(rrow.monsters && rrow.monsters.length===3) monsters = rrow.monsters;
    } else {
      await sb.from('mmo_rooms').insert({ room_code: roomCode, kills:0, monsters: monsters });
    }

    me.name = myName;
    me.guild = myGuild;
    me.classIdx = myClass;
    me.joinedAt = Date.now();

    // 3. เชื่อมต่อ Realtime Broadcast & Presence
    const channelName = 'room_' + roomCode;
    channel = sb.channel(channelName, {
      config: {
        broadcast: { ack: false, self: false },
        presence: { key: myId }
      }
    });

    // ฟังตำแหน่งเพื่อนผ่าน Broadcast
    channel.on('broadcast', { event: 'pos' }, ({ payload }) => {
      if(payload.id && payload.id !== myId){
        otherPlayers[payload.id] = Object.assign(otherPlayers[payload.id] || {}, payload);
      }
    });

    // ฟังการโจมตี
    channel.on('broadcast', { event: 'atk' }, ({ payload }) => {
      if(payload.id !== myId && otherPlayers[payload.id]){
        otherPlayers[payload.id].attacking = true;
        otherPlayers[payload.id].attackUntil = Date.now() + ATTACK_DURATION;
      }
      if(isHost) handleDamage(payload);
    });

    // ฟังแชท
    channel.on('broadcast', { event: 'chat' }, ({ payload }) => {
      addChatLine(payload.name, payload.text);
    });

    // ฟัง Presence รายชื่อคนในห้อง
    channel.on('presence', { event: 'sync' }, () => {
      const state = channel.presenceState();
      const keys = Object.keys(state);
      
      // ล้างคนที่ออกไปแล้ว
      Object.keys(otherPlayers).forEach(id => {
        if(!state[id]) delete otherPlayers[id];
      });

      // ตรวจสอบ Host (คนที่เข้ามาเร็วที่สุด)
      let earliest = myId;
      let earliestTime = me.joinedAt;
      keys.forEach(k => {
        const u = state[k]?.[0];
        if(u && u.joinedAt < earliestTime){
          earliest = k;
          earliestTime = u.joinedAt;
        }
      });
      isHost = (earliest === myId);

      renderRoster(state);
    });

    channel.subscribe(async (status) => {
      debugLog('สถานะการเชื่อมต่อ: ' + status, status==='SUBSCRIBED' ? 'info':'warn');

      if(status === 'SUBSCRIBED'){
        await channel.track({ name: myName, guild: myGuild, joinedAt: me.joinedAt });
        landing.style.display = 'none';
        gameEl.style.display = 'flex';
        roomTag.textContent = `ห้อง: ${roomCode}`;
        statusEl.textContent = 'เข้าสู่ยุทธภพแล้ว';
        updateMeHUD();
        gameActive = true;
        requestAnimationFrame(loop);
      } else if(status === 'CLOSED' || status === 'CHANNEL_ERROR'){
        statusEl.textContent = 'การเชื่อมต่อขัดข้อง กำลังลองใหม่...';
      }
    });

  }catch(err){
    debugLog('เกิดข้อผิดพลาด: ' + err.message, 'error');
    joinBtn.disabled=false; joinBtn.textContent='เข้าสู่ยุทธภพ';
  }
}

function handleDamage(p){
  let changed = false;
  monsters.forEach(m => {
    if(!m.alive) return;
    const dist = Math.hypot(p.x - m.x, p.y - m.y);
    if(dist < ATTACK_RANGE){
      m.hp = Math.max(0, m.hp - DAMAGE);
      changed = true;
      if(m.hp <= 0 && m.alive){
        m.alive = false;
        roomKillsTotal += 1;
        spawnDeathBurstAt(m.x, m.y);
        awardKill(p.name);
        setTimeout(() => {
          m.hp = m.maxHp;
          m.alive = true;
          syncMonsters();
        }, 5000);
      }
    }
  });
  if(changed) syncMonsters();
}

async function syncMonsters(){
  await sb.from('mmo_rooms').update({ monsters, kills: roomKillsTotal }).eq('room_code', roomCode);
}

async function awardKill(killerName){
  myProgress.exp += EXP_PER_KILL;
  if(myProgress.exp >= expNeeded(myProgress.level)){
    myProgress.exp -= expNeeded(myProgress.level);
    myProgress.level += 1;
    showToast(`ยินดีด้วย! เลเวลอัปเป็น Lv.${myProgress.level}`);
  }
  updateMeHUD();
  await sb.from('mmo_players').update({ exp: myProgress.exp, level: myProgress.level }).eq('name', myName);
}

function renderRoster(state){
  rosterEl.innerHTML = '';
  const userKeys = Object.keys(state);
  userKeys.forEach(k => {
    const u = state[k]?.[0] || {};
    const span = document.createElement('span');
    span.className = 'rostertag active';
    span.textContent = (u.guild ? `[${u.guild}] ` : '') + (u.name || 'จอมยุทธ์');
    rosterEl.appendChild(span);
  });
  for(let i=userKeys.length; i<MAX_PLAYERS; i++){
    const span = document.createElement('span');
    span.className = 'rostertag';
    span.textContent = '— ว่าง —';
    rosterEl.appendChild(span);
  }
}

function updateMeHUD(){
  lvText.textContent = `Lv.${myProgress.level}`;
  guildText.textContent = myGuild ? `[${myGuild}]` : '';
  const pct = Math.min(100, (myProgress.exp / expNeeded(myProgress.level)) * 100);
  expBar.style.width = pct + '%';
}

// Costumes
costumeBtn.addEventListener('click', ()=>{
  costumeList.innerHTML='';
  COSTUME_DEFS.forEach((c,idx)=>{
    const unlocked = myProgress.unlockedCostumes.includes(idx);
    const sw = document.createElement('div');
    sw.className = 'swatch' + (me.costume===idx?' selected':'');
    sw.style.background = `linear-gradient(160deg, ${c.accent}, ${c.main})`;
    sw.style.opacity = unlocked ? '1' : '.35';
    sw.textContent = unlocked ? c.label : '🔒';
    if(unlocked){
      sw.addEventListener('click', async ()=>{
        me.costume = idx;
        costumeModal.style.display='none';
        sb.from('mmo_players').update({ costume: idx }).eq('name', myName);
      });
    }
    costumeList.appendChild(sw);
  });
  costumeModal.style.display='flex';
});
closeCostume.addEventListener('click', ()=>{ costumeModal.style.display='none'; });

// Inputs
window.addEventListener('keydown', e=>{
  keys[e.key.toLowerCase()] = true;
  if(e.key === ' '){ e.preventDefault(); tryAttack(); }
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousedown', tryAttack);

function bindHold(id, key){
  const el = document.getElementById(id);
  el.addEventListener('touchstart', e=>{ e.preventDefault(); keys[key]=true; });
  el.addEventListener('touchend', e=>{ keys[key]=false; });
}
bindHold('dU','arrowup'); bindHold('dD','arrowdown'); bindHold('dL','arrowleft'); bindHold('dR','arrowright');
document.getElementById('tpAttack').addEventListener('touchstart', e=>{ e.preventDefault(); tryAttack(); });

function tryAttack(){
  if(!gameActive) return;
  const now = Date.now();
  if(now < lastAttackCooldownUntil) return;
  lastAttackCooldownUntil = now + ATTACK_COOLDOWN;
  me.attacking = true;
  me.attackUntil = now + ATTACK_DURATION;
  spawnSlash();
  
  if(channel){
    channel.send({
      type: 'broadcast',
      event: 'atk',
      payload: { id: myId, name: myName, x: me.x, y: me.y }
    });
  }
  if(isHost) handleDamage({ id: myId, name: myName, x: me.x, y: me.y });
}

function spawnSlash(){
  const dir = me.facing;
  const ox = me.x + dir * 26, oy = me.y - 40;
  const c = COSTUME_DEFS[me.costume] || COSTUME_DEFS[0];
  for(let i=0;i<14;i++){
    particles.push({
      x:ox, y:oy+(Math.random()-0.5)*26,
      vx:dir*(3+Math.random()*4), vy:(Math.random()-0.5)*2,
      life:1, decay:0.045+Math.random()*0.02, r:2+Math.random()*3, color:c.accent
    });
  }
}

function spawnDeathBurstAt(x,y){
  for(let i=0;i<36;i++){
    particles.push({
      x, y, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8,
      life:1, decay:0.02+Math.random()*0.02, r:2+Math.random()*4, color:'#f0cf6a'
    });
  }
}

// Chat
chatform.addEventListener('submit', e=>{
  e.preventDefault();
  const text = chatInput.value.trim();
  if(!text) return;
  chatInput.value = '';
  addChatLine(myName, text);
  if(channel){
    channel.send({ type: 'broadcast', event: 'chat', payload: { name: myName, text } });
  }
});

function addChatLine(name, text){
  chatMessages.unshift({ name, text });
  chatMessages = chatMessages.slice(0, 5);
  chatlogEl.innerHTML = chatMessages.map(m=>`<div><b style="color:#f0cf6a">${m.name}:</b> ${m.text}</div>`).join('');
}

// Loop
function loop(ts){
  if(!gameActive) return;

  let dx = 0, dy = 0;
  if(keys['arrowleft'] || keys['a']) dx -= MOVE_SPEED;
  if(keys['arrowright'] || keys['d']) dx += MOVE_SPEED;
  if(keys['arrowup'] || keys['w']) dy -= MOVE_SPEED;
  if(keys['arrowdown'] || keys['s']) dy += MOVE_SPEED;

  if(dx !== 0) me.facing = dx > 0 ? 1 : -1;
  me.x = Math.max(30, Math.min(ARENA_W - 30, me.x + dx));
  me.y = Math.max(60, Math.min(ARENA_H - 30, me.y + dy));

  const now = Date.now();
  if(me.attacking && now > me.attackUntil) me.attacking = false;

  // Broadcast ตำแหน่งแบบจำกัดความถี่
  if(ts - lastSyncTime > SYNC_INTERVAL && channel){
    lastSyncTime = ts;
    channel.send({
      type: 'broadcast',
      event: 'pos',
      payload: { id: myId, name: myName, guild: myGuild, x: me.x, y: me.y, facing: me.facing, costume: me.costume }
    });
  }

  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= p.decay; });
  particles = particles.filter(p => p.life > 0);

  render();
  requestAnimationFrame(loop);
}

function drawFigure(p, costumeIdx){
  const c = COSTUME_DEFS[costumeIdx] || COSTUME_DEFS[0];
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(p.facing || 1, 1);

  ctx.beginPath(); ctx.ellipse(0, 6, 22, 6, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-13, 0); ctx.quadraticCurveTo(-22, -30, -8, -58); ctx.lineTo(8, -58);
  ctx.quadraticCurveTo(24, -30, 13, 0); ctx.closePath();
  const grad = ctx.createLinearGradient(0, -58, 0, 0);
  grad.addColorStop(0, c.accent); grad.addColorStop(1, c.main);
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.stroke();

  ctx.beginPath(); ctx.arc(0, -68, 10, 0, Math.PI * 2); ctx.fillStyle = '#e8cfa0'; ctx.fill();
  ctx.beginPath(); ctx.arc(0, -80, 3.5, 0, Math.PI * 2); ctx.fillStyle = '#1a1410'; ctx.fill();

  if(p.attacking && Date.now() < p.attackUntil){
    const prog = 1 - Math.max(0, (p.attackUntil - Date.now()) / ATTACK_DURATION);
    ctx.save();
    ctx.rotate(-0.9 + prog * 1.8);
    ctx.beginPath(); ctx.moveTo(5, -45); ctx.lineTo(58, -48);
    ctx.lineWidth = 4; ctx.strokeStyle = '#fff6d8';
    ctx.shadowColor = c.accent; ctx.shadowBlur = 16; ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  ctx.save();
  ctx.font = '11px "Noto Sans Thai",sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#cfc7ad';
  const label = (p.guild ? `[${p.guild}] ` : '') + (p.name || '');
  ctx.fillText(label, p.x, p.y - 92);
  ctx.restore();
}

function drawMonster(m){
  ctx.save();
  ctx.translate(m.x, m.y);
  if(!m.alive){ ctx.restore(); return; }
  const pulse = 1 + Math.sin(Date.now() / 300) * 0.03;
  ctx.scale(pulse, pulse);
  ctx.beginPath(); ctx.ellipse(0, 8, 48, 12, 0, 0, Math.PI * 2); ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fill();
  ctx.beginPath();
  ctx.moveTo(-36, 10); ctx.quadraticCurveTo(-48, -40, -8, -62);
  ctx.quadraticCurveTo(0, -70, 8, -62); ctx.quadraticCurveTo(48, -40, 36, 10);
  ctx.quadraticCurveTo(0, 20, -36, 10); ctx.closePath();
  const g = ctx.createRadialGradient(0, -24, 8, 0, -24, 72);
  g.addColorStop(0, '#3a2a44'); g.addColorStop(1, '#120c16');
  ctx.fillStyle = g; ctx.fill();
  ctx.beginPath(); ctx.arc(-11, -42, 4, 0, Math.PI * 2); ctx.arc(11, -42, 4, 0, Math.PI * 2);
  ctx.fillStyle = '#ff5a5a'; ctx.shadowColor = '#ff5a5a'; ctx.shadowBlur = 12; ctx.fill();
  ctx.restore();

  // หลอดเลือด
  ctx.save();
  const w = 60;
  ctx.translate(m.x - w / 2, m.y - 84);
  ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, w, 6);
  ctx.fillStyle = '#c23b4a'; ctx.fillRect(0, 0, w * (m.hp / m.maxHp), 6);
  ctx.restore();
}

function render(){
  ctx.clearRect(0, 0, ARENA_W, ARENA_H);
  
  // ตารางพื้นหลัง
  ctx.strokeStyle = 'rgba(140,160,110,.08)';
  for(let gx=0; gx<ARENA_W; gx+=40){ ctx.beginPath(); ctx.moveTo(gx,0); ctx.lineTo(gx,ARENA_H); ctx.stroke(); }
  
  monsters.forEach(drawMonster);

  // วาดผู้เล่นคนอื่น
  Object.values(otherPlayers).forEach(p => {
    drawFigure(p, p.costume || 0);
  });

  // วาดตัวเอง
  drawFigure(me, me.costume);

  // เอฟเฟกต์ฟัน
  particles.forEach(p => {
    ctx.save(); ctx.globalAlpha = Math.max(0, p.life);
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = p.color; ctx.shadowColor = p.color; ctx.shadowBlur = 8; ctx.fill();
    ctx.restore();
  });
}

})();
</script>
