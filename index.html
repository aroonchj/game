<script>
(function(){
"use strict";

const PLAYER_MAX_HP = 150;
const MONSTER_MAX_HP = 250;
const EXP_PER_KILL = 50;
const MOVE_SPEED = 0.22;

let sb = null, channel = null;
let myName = "", roomCode = "", myGuild = "", myId = "";
let gameActive = false, isHost = false;
let keys = {};
let otherPlayers = {};
let myProgress = { level: 1, exp: 0 };
let lastSyncTime = 0;

let cooldowns = {
  atk: { cd: 350, until: 0, dmg: 20, range: 4.5 },
  Q: { cd: 1800, until: 0, dmg: 40, range: 8.0 },
  E: { cd: 4000, until: 0, dmg: 60, range: 9.0 },
  R: { cd: 7000, until: 0, dmg: 95, range: 11.0 }
};

let me = {
  id: '', x: 0, z: 0, rot: 0,
  hp: PLAYER_MAX_HP, maxHp: PLAYER_MAX_HP,
  isDead: false, respawnAt: 0, joinedAt: 0
};

// ข้อมูลมอนสเตอร์ 3D
let monsters = [
  { id: 'm1', x: 14, z: -8, hp: MONSTER_MAX_HP, maxHp: MONSTER_MAX_HP, alive: true, mesh: null },
  { id: 'm2', x: 14, z: 8, hp: MONSTER_MAX_HP, maxHp: MONSTER_MAX_HP, alive: true, mesh: null }
];

// Three.js Core Variables
let scene, camera, renderer;
let myHeroMesh = null;
let vfxParticles = [];

const landing = document.getElementById('landing');
const game3d = document.getElementById('game3d');
const joinBtn = document.getElementById('joinBtn');
const nameInput = document.getElementById('nameInput');
const roomInput = document.getElementById('roomInput');
const guildInput = document.getElementById('guildInput');
const roomTag = document.getElementById('room-tag');
const rosterEl = document.getElementById('roster');
const chatlogEl = document.getElementById('chatlog');
const chatform = document.getElementById('chatform');
const chatInput = document.getElementById('chatInput');
const lvText = document.getElementById('lvText');
const guildText = document.getElementById('guildText');
const myHpBar = document.getElementById('myHpBar');
const expBar = document.getElementById('expBar');
const toastEl = document.getElementById('toast');

function genId(){ return 'p_' + Math.random().toString(36).slice(2,8); }
function expNeeded(lvl){ return 100 * lvl; }
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.style.display = 'block';
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>{ toastEl.style.display='none'; }, 3000);
}

// ---------------- Init 3D Scene ----------------
function init3D(){
  const container = document.getElementById('canvas3d');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0e0b08);
  scene.fog = new THREE.FogExp2(0x0e0b08, 0.025);

  camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(0, 22, 24);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  container.appendChild(renderer.domElement);

  // แสงไฟ
  const ambientLight = new THREE.AmbientLight(0xfff0dd, 0.7);
  scene.add(ambientLight);

  const dirLight = new THREE.DirectionalLight(0xffecd0, 1.2);
  dirLight.position.set(20, 40, 20);
  dirLight.castShadow = true;
  dirLight.shadow.mapSize.width = 1024;
  dirLight.shadow.mapSize.height = 1024;
  scene.add(dirLight);

  // พื้นลานประลองหิน
  const floorGeo = new THREE.PlaneGeometry(60, 60);
  const floorMat = new THREE.MeshStandardMaterial({ color: 0x241a14, roughness: 0.8 });
  const floor = new THREE.Mesh(floorGeo, floorMat);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // เส้นตารางลานหิน
  const grid = new THREE.GridHelper(60, 20, 0xd4af37, 0x3d2c1f);
  grid.position.y = 0.02;
  scene.add(grid);

  // ซุ้มประตูจีน & กำแพง
  createChineseGate(-20, 0);
  createChineseGate(20, 0);

  // เสาโคมไฟโบราณ
  createLanternPost(-12, -12);
  createLanternPost(-12, 12);
  createLanternPost(12, -12);
  createLanternPost(12, 12);

  // สร้างโมเดลตัวละครของตัวเอง
  myHeroMesh = createHero3D(0xd4af37);
  scene.add(myHeroMesh);

  // สร้างมอนสเตอร์ 3D
  monsters.forEach(m => {
    m.mesh = createMonster3D();
    m.mesh.position.set(m.x, 0, m.z);
    scene.add(m.mesh);
  });

  window.addEventListener('resize', onWindowResize);
}

function createChineseGate(x, z){
  const gateGroup = new THREE.Group();
  const pillarMat = new THREE.MeshStandardMaterial({ color: 0x6e1b24 });
  const goldMat = new THREE.MeshStandardMaterial({ color: 0xd4af37, metalness: 0.6, roughness: 0.3 });

  // เสาสองต้น
  const p1 = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 8), pillarMat);
  p1.position.set(-3, 4, 0);
  p1.castShadow = true;
  const p2 = p1.clone();
  p2.position.set(3, 4, 0);
  gateGroup.add(p1, p2);

  // คานและหลังคา
  const beam = new THREE.Mesh(new THREE.BoxGeometry(8, 0.8, 1.2), pillarMat);
  beam.position.set(0, 7.5, 0);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(5.5, 2, 4), goldMat);
  roof.position.set(0, 9, 0);
  roof.rotation.y = Math.PI / 4;
  gateGroup.add(beam, roof);

  gateGroup.position.set(x, 0, z);
  scene.add(gateGroup);
}

function createLanternPost(x, z){
  const group = new THREE.Group();
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.2, 5), new THREE.MeshStandardMaterial({ color: 0x3d2817 }));
  post.position.y = 2.5;

  const lantern = new THREE.Mesh(new THREE.SphereGeometry(0.6, 12, 12), new THREE.MeshBasicMaterial({ color: 0xff3b30 }));
  lantern.position.set(0, 4.5, 0);

  const light = new THREE.PointLight(0xff5533, 1.2, 10);
  light.position.set(0, 4.5, 0);

  group.add(post, lantern, light);
  group.position.set(x, 0, z);
  scene.add(group);
}

// ---------------- 3D Hero Model ----------------
function createHero3D(robeColor = 0xd4af37){
  const hero = new THREE.Group();
  const robeMat = new THREE.MeshStandardMaterial({ color: robeColor, roughness: 0.5 });
  const skinMat = new THREE.MeshStandardMaterial({ color: 0xfce5cd });
  const hatMat = new THREE.MeshStandardMaterial({ color: 0xc5a059, roughness: 0.8 });
  const swordMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.8 });

  // ลำตัวชุดจอมยุทธ์
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.7, 1.6, 12), robeMat);
  body.position.y = 1.0;
  body.castShadow = true;
  hero.add(body);

  // ศีรษะ
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.35, 16, 16), skinMat);
  head.position.y = 2.0;
  hero.add(head);

  // หมวกงอบไม้ไผ่
  const hat = new THREE.Mesh(new THREE.ConeGeometry(0.9, 0.35, 16), hatMat);
  hat.position.y = 2.3;
  hero.add(hat);

  // กระบี่สะพายหลัง
  const sword = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.6, 0.2), swordMat);
  sword.position.set(0.3, 1.3, -0.4);
  sword.rotation.z = Math.PI / 6;
  hero.add(sword);

  return hero;
}

// ---------------- 3D Monster Model ----------------
function createMonster3D(){
  const mon = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({ color: 0x4a1843, roughness: 0.6 });
  const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff2233 });

  // หินโกเลมอสูร
  const body = new THREE.Mesh(new THREE.DodecahedronGeometry(1.2), bodyMat);
  body.position.y = 1.2;
  body.castShadow = true;
  mon.add(body);

  // ดวงตาสีแดง
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), eyeMat);
  eyeL.position.set(-0.35, 1.4, 0.95);
  const eyeR = eyeL.clone();
  eyeR.position.set(0.35, 1.4, 0.95);
  mon.add(eyeL, eyeR);

  return mon;
}

function onWindowResize(){
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ---------------- Realtime Networking ----------------
async function joinRoom(){
  const nm = nameInput.value.trim();
  const rc = roomInput.value.trim().toLowerCase().replace(/\s+/g,'');
  const gd = guildInput.value.trim();
  if(!nm || !rc) return;

  myName = nm; roomCode = rc; myGuild = gd; myId = genId();
  me.id = myId;
  joinBtn.disabled = true; joinBtn.textContent = 'กำลังเชื่อมต่อยุทธภพ 3D...';

  try{
    sb = window.supabase.createClient(window.SUPABASE_URL, window.SUPABASE_ANON_KEY);

    const { data: prow } = await sb.from('mmo_players').select('*').eq('name', myName).maybeSingle();
    if(prow){
      myProgress.level = prow.level || 1;
      myProgress.exp = prow.exp || 0;
    } else {
      myProgress = { level: 1, exp: 0 };
      await sb.from('mmo_players').insert({ name: myName, level: 1, exp: 0, guild: myGuild });
    }

    me.joinedAt = Date.now();

    const channelName = 'room3d_' + roomCode;
    channel = sb.channel(channelName, {
      config: { broadcast: { ack: false, self: false }, presence: { key: myId } }
    });

    channel.on('broadcast', { event: 'pos' }, ({ payload }) => {
      if(payload && payload.id && payload.id !== myId){
        if(!otherPlayers[payload.id]){
          const mesh = createHero3D(0xe63950);
          scene.add(mesh);
          otherPlayers[payload.id] = { ...payload, mesh };
        } else {
          Object.assign(otherPlayers[payload.id], payload);
        }
      }
    });

    channel.on('broadcast', { event: 'skill' }, ({ payload }) => {
      if(payload && payload.id !== myId){
        triggerSkillVisuals3D(payload.skill, payload.x, payload.z);
      }
      if(isHost) checkSkillHitMonster(payload);
      checkSkillHitMe(payload);
    });

    channel.on('broadcast', { event: 'reward' }, ({ payload }) => {
      if(payload && payload.targetName === myName) gainExp(payload.exp, payload.sourceName);
    });

    channel.on('presence', { event: 'sync' }, () => {
      const state = channel.presenceState();
      const keys = Object.keys(state);

      Object.keys(otherPlayers).forEach(id => {
        if(!state[id]){
          if(otherPlayers[id].mesh) scene.remove(otherPlayers[id].mesh);
          delete otherPlayers[id];
        }
      });

      let earliest = myId;
      let earliestTime = me.joinedAt;
      keys.forEach(k => {
        const u = state[k]?.[0];
        if(u && u.joinedAt < earliestTime){ earliest = k; earliestTime = u.joinedAt; }
      });
      isHost = (earliest === myId);
      renderRoster(state);
    });

    channel.subscribe((status) => {
      if(status === 'SUBSCRIBED'){
        channel.track({ name: myName, guild: myGuild, joinedAt: me.joinedAt });
        landing.style.display = 'none';
        game3d.style.display = 'block';
        roomTag.textContent = `ลานประลอง 3D: ${roomCode}`;
        init3D();
        updateMeHUD();
        gameActive = true;
        animate();
      }
    });

  }catch(e){
    joinBtn.disabled = false; joinBtn.textContent = 'ก้าวสู่ยุทธภพ 3D';
    alert('เชื่อมต่อไม่สำเร็จ: ' + e.message);
  }
}

// ---------------- สกิล 3D Effects ----------------
function castSkill(k){
  if(!gameActive || me.isDead) return;
  const sk = cooldowns[k];
  const now = Date.now();
  if(now < sk.until) return;

  sk.until = now + sk.cd;
  triggerSkillVisuals3D(k, me.x, me.z);

  const payload = { id: myId, name: myName, x: me.x, z: me.z, skill: k, dmg: sk.dmg, range: sk.range };
  if(channel) channel.send({ type: 'broadcast', event: 'skill', payload });
  if(isHost) checkSkillHitMonster(payload);
}

function triggerSkillVisuals3D(skill, x, z){
  if(skill === 'atk' || skill === 'Q'){
    // วงแหวนคลื่นดาบฟัน
    const ringGeo = new THREE.RingGeometry(0.5, skill==='Q'?3.5:2.0, 32);
    const ringMat = new THREE.MeshBasicMaterial({ color: skill==='Q'?0xfae17d:0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.9 });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(x, 0.4, z);
    scene.add(ring);
    vfxParticles.push({ mesh: ring, life: 1.0, decay: 0.05, scaleUp: true });
  } else if(skill === 'E'){
    // หมื่นกระบี่แสงตกลงมาจากฟ้า
    for(let i=0; i<8; i++){
      setTimeout(()=>{
        const sw = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.2, 0.3), new THREE.MeshBasicMaterial({ color: 0x48bb78 }));
        const rx = x + (Math.random()-0.5)*7;
        const rz = z + (Math.random()-0.5)*7;
        sw.position.set(rx, 10, rz);
        scene.add(sw);
        vfxParticles.push({ mesh: sw, vy: -0.6, life: 1.0, decay: 0.03 });
      }, i * 40);
    }
  } else if(skill === 'R'){
    // ปราณเพลิงระเบิดรอบทิศ
    const blast = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), new THREE.MeshBasicMaterial({ color: 0xff3344, wireframe: true }));
    blast.position.set(x, 1.2, z);
    scene.add(blast);
    vfxParticles.push({ mesh: blast, life: 1.0, decay: 0.03, scaleSpeed: 0.35 });
  }
}

function checkSkillHitMe(atk){
  if(me.isDead || !atk) return;
  const dist = Math.hypot((atk.x||0) - me.x, (atk.z||0) - me.z);
  if(dist < (atk.range || 4.5)){
    me.hp = Math.max(0, me.hp - (atk.dmg || 20));
    updateMeHUD();
    if(me.hp <= 0){
      me.isDead = true;
      me.respawnAt = Date.now() + 3500;
      showToast(`ท่านพ่ายแพ้ให้กับ [${atk.name}] !`);
      if(channel){
        channel.send({ type: 'broadcast', event: 'reward', payload: { targetName: atk.name, exp: EXP_PER_KILL*2, sourceName: myName } });
      }
    }
  }
}

function checkSkillHitMonster(atk){
  if(!atk) return;
  monsters.forEach(m => {
    if(!m.alive) return;
    const dist = Math.hypot((atk.x||0) - m.x, (atk.z||0) - m.z);
    if(dist < (atk.range || 4.5)){
      m.hp = Math.max(0, m.hp - (atk.dmg || 20));
      if(m.hp <= 0 && m.alive){
        m.alive = false;
        m.mesh.visible = false;
        if(channel) channel.send({ type: 'broadcast', event: 'reward', payload: { targetName: atk.name, exp: EXP_PER_KILL, sourceName: 'อสูร 3D' } });
        if(atk.name === myName) gainExp(EXP_PER_KILL, 'อสูร 3D');

        setTimeout(()=>{
          m.hp = MONSTER_MAX_HP;
          m.alive = true;
          m.mesh.visible = true;
        }, 5000);
      }
    }
  });
}

async function gainExp(amt, src){
  myProgress.exp += amt;
  showToast(`+${amt} EXP (${src})`);
  while(myProgress.exp >= expNeeded(myProgress.level)){
    myProgress.exp -= expNeeded(myProgress.level);
    myProgress.level += 1;
    showToast(`🌟 สำเร็จขั้นบรรลุ Lv.${myProgress.level} 🌟`);
  }
  updateMeHUD();
  await sb.from('mmo_players').update({ exp: myProgress.exp, level: myProgress.level }).eq('name', myName);
}

function renderRoster(state){
  rosterEl.innerHTML = '';
  Object.keys(state).forEach(k => {
    const u = state[k]?.[0] || {};
    const span = document.createElement('span');
    span.className = 'rostertag';
    span.textContent = (u.guild ? `[${u.guild}] ` : '') + (u.name || 'จอมยุทธ์');
    rosterEl.appendChild(span);
  });
}

function updateMeHUD(){
  lvText.textContent = `Lv.${myProgress.level}`;
  guildText.textContent = myGuild ? `[${myGuild}]` : '';
  myHpBar.style.width = Math.max(0, (me.hp / me.maxHp) * 100) + '%';
  expBar.style.width = Math.min(100, (myProgress.exp / expNeeded(myProgress.level)) * 100) + '%';
}

// ---------------- Loop & Animations ----------------
function animate(){
  if(!gameActive) return;
  requestAnimationFrame(animate);

  // ควบคุมการเคลื่อนที่ 3D
  if(!me.isDead){
    let dx = 0, dz = 0;
    if(keys['w'] || keys['arrowup']) dz -= MOVE_SPEED;
    if(keys['s'] || keys['arrowdown']) dz += MOVE_SPEED;
    if(keys['a'] || keys['arrowleft']) dx -= MOVE_SPEED;
    if(keys['d'] || keys['arrowright']) dx += MOVE_SPEED;

    me.x = Math.max(-26, Math.min(26, me.x + dx));
    me.z = Math.max(-26, Math.min(26, me.z + dz));

    if(dx !== 0 || dz !== 0){
      me.rot = Math.atan2(dx, dz);
    }
  } else {
    if(Date.now() > me.respawnAt){
      me.isDead = false;
      me.hp = PLAYER_MAX_HP;
      me.x = 0; me.z = 0;
      updateMeHUD();
      showToast('ฟื้นกำลังคืนชีพแล้ว!');
    }
  }

  // อัปเดตตำแหน่งโมเดลตัวเอง
  if(myHeroMesh){
    myHeroMesh.position.set(me.x, me.isDead ? -0.8 : 0, me.z);
    myHeroMesh.rotation.y = me.rot;
  }

  // กล้องเคลื่อนที่ตามผู้เล่น
  camera.position.x += (me.x - camera.position.x) * 0.05;
  camera.position.z += (me.z + 18 - camera.position.z) * 0.05;
  camera.lookAt(me.x, 1, me.z);

  // อัปเดตตำแหน่งผู้เล่นอื่น
  Object.values(otherPlayers).forEach(p => {
    if(p.mesh){
      p.mesh.position.set(p.x, p.isDead ? -0.8 : 0, p.z);
      p.mesh.rotation.y = p.rot || 0;
    }
  });

  // อนิเมชันมอนสเตอร์ลอยตัว
  monsters.forEach((m, idx) => {
    if(m.mesh && m.alive){
      m.mesh.position.y = 1.0 + Math.sin(Date.now()*0.003 + idx)*0.3;
      m.mesh.rotation.y += 0.015;
    }
  });

  // อัปเดต VFX 3D
  for(let i = vfxParticles.length - 1; i >= 0; i--){
    const p = vfxParticles[i];
    p.life -= p.decay;
    if(p.vy) p.mesh.position.y += p.vy;
    if(p.scaleUp) p.mesh.scale.multiplyScalar(1.06);
    if(p.scaleSpeed) p.mesh.scale.addScalar(p.scaleSpeed);
    if(p.mesh.material) p.mesh.material.opacity = p.life;

    if(p.life <= 0){
      scene.remove(p.mesh);
      vfxParticles.splice(i, 1);
    }
  }

  // อัปเดต Cooldown UI
  const now = Date.now();
  ['atk','Q','E','R'].forEach(k => {
    const el = document.getElementById('cd' + (k==='atk'?'Atk':k));
    if(el){
      const rem = Math.max(0, cooldowns[k].until - now);
      el.style.height = (rem / cooldowns[k].cd) * 100 + '%';
    }
  });

  // Sync เครือข่าย
  if(now - lastSyncTime > 150 && channel){
    lastSyncTime = now;
    channel.send({
      type: 'broadcast',
      event: 'pos',
      payload: { id: myId, name: myName, guild: myGuild, x: me.x, z: me.z, rot: me.rot, hp: me.hp, isDead: me.isDead }
    });
  }

  renderer.render(scene, camera);
}

// ---------------- Event Listeners ----------------
window.addEventListener('keydown', e => {
  if(!e || !e.key) return;
  const k = e.key.toLowerCase();
  keys[k] = true;
  if(e.key === ' ') { e.preventDefault(); castSkill('atk'); }
  if(k === 'q') castSkill('Q');
  if(k === 'e') castSkill('E');
  if(k === 'r') castSkill('R');
});
window.addEventListener('keyup', e => {
  if(e && e.key) keys[e.key.toLowerCase()] = false;
});

document.getElementById('btnAtk').addEventListener('click', ()=>castSkill('atk'));
document.getElementById('btnQ').addEventListener('click', ()=>castSkill('Q'));
document.getElementById('btnE').addEventListener('click', ()=>castSkill('E'));
document.getElementById('btnR').addEventListener('click', ()=>castSkill('R'));

joinBtn.addEventListener('click', joinRoom);
[nameInput, roomInput, guildInput].forEach(inp => inp.addEventListener('keydown', e => { if(e.key==='Enter') joinRoom(); }));

chatform.addEventListener('submit', e => {
  e.preventDefault();
  const text = chatInput.value.trim();
  if(!text) return;
  chatInput.value = '';
  const d = document.createElement('div');
  d.innerHTML = `<b style="color:var(--gold-bright)">${myName}:</b> ${text}`;
  chatlogEl.prepend(d);
});

})();
</script>
